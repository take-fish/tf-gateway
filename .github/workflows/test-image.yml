# push test → 构建测试镜像 ghcr.io/take-fish/tf-gateway:test
# 集中机 scripts/auto-update-test.sh 每 2 分钟拉取并重建测试容器。
# 生产 :latest 仍由 release.yml 在 master 发布时负责。
name: Test Image

on:
  push:
    branches: [test]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: test-image
  cancel-in-progress: true

jobs:
  publish:
    name: publish :test
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/take-fish/tf-gateway
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=test
            type=sha,prefix=test-

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
