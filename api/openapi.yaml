openapi: 3.0.3
info:
  title: tf-gateway API
  version: 0.3.0
  description: |
    FishMatrix 统一网关：路由与实例列表来自 Nacos，按前缀/精确路径反向代理到业务服务，
    透传 WebSocket；Nacos 不可用时回退静态 `TF_*_URL`。

    默认路由（保留原始路径与 query）：
    - `/api/v1/user/**`    → `tf-user`
    - `/api/v1/chat/**`    → `tf-chat`
    - `/api/v1/reader/**`  → `tf-reader`
    - `/api/v1/game/**`    → `tf-game`
    - `/api/v1/music/**`   → `tf-music`
    - `/ws/chat`           → `tf-chat`，支持 WebSocket Upgrade

    路由配置：Nacos `dataId=tf-gateway.yaml`、`group=FM`、namespace `fm-prod|fm-test`。

paths:
  /healthz:
    get:
      summary: 健康检查（ok / degraded / failed）
      responses:
        "200":
          description: 路由可用，返回 Nacos 状态与 routeVersion
        "503":
          description: 无可用路由
  /readyz:
    get:
      summary: 就绪检查
      responses:
        "200":
          description: 至少有一份有效路由
        "503":
          description: 尚未加载路由
  /api/v1/monitor/metrics:
    get:
      summary: 网关指标（伪装路径）
      responses:
        "200":
          description: 指标数据
  /api/v1/chat/{path}:
    get:
      summary: 聊天服务代理示例（其余前缀同理）
      parameters:
        - in: path
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 上游响应
        "502":
          description: 上游不可用，返回 {"error":"BAD_GATEWAY","message":"upstream unavailable"}
